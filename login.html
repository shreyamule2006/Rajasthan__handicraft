<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in | Rajasthan Handicrafts</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <header class="header"><a class="brand" href="index.html"><span class="logo">RH</span><span
                class="brand-copy">Rajasthan<strong>Handicrafts</strong></span></a>
        <nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="contact.html">Contact</a>
        </nav>
        <div class="header-actions"><a class="icon-link" href="checkout.html">🛍<b class="cart-count">0</b></a></div>
    </header>
    <main class="login-wrap">
        <section class="login-box">
            <p class="eyebrow">Welcome back</p>
            <h1>Sign in to your account.</h1>
            <p>View your saved favourites and keep track of your handmade finds.</p>
            <form data-demo-form data-message="Demo login successful. Welcome back!">
                <div class="field"><label for="login-email">Email address</label><input id="login-email" type="email"
                        required placeholder="you@example.com"></div>
                <div class="field"><label for="password">Password</label><input id="password" type="password" required
                        placeholder="Your password"></div>
                <div class="helper"><label><input type="checkbox"> Remember me</label><a href="contact.html">Forgot
                        password?</a></div><button class="btn btn-primary btn-full">Sign in</button>
                <div id="form-notice" class="notice"></div>
            </form>
            <p style="margin:23px 0 0;text-align:center;font-size:.84rem">New to Rajasthan Handicrafts? <a
                    href="contact.html" style="color:var(--clay);font-weight:700">Create an account</a></p>
        </section>
    </main>
    <script src="assets/app.js"></script>
</body>

</html>
